port: 8004
util_class_name: JiraUtils
util_file_name: jira_utils.py
description: |-
  A comprehensive Model Context Protocol (MCP) server that provides Jira issue management capabilities. 
  This server enables AI assistants to interact with Jira instances to manage issues, search for tickets, add comments, and perform various Jira operations.
tags:
  - jira
env:
  JIRA_API_TOKEN: ${JIRA_API_TOKEN}
  JIRA_BASE_URL: ${JIRA_BASE_URL}
  JIRA_EMAIL: ${JIRA_EMAIL}
